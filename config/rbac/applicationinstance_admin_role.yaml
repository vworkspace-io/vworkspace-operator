# This rule is not used by the project vworkspace-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over apps.vworkspace.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vworkspace-operator
    app.kubernetes.io/managed-by: kustomize
  name: applicationinstance-admin-role
rules:
- apiGroups:
  - apps.vworkspace.io
  resources:
  - applicationinstances
  verbs:
  - '*'
- apiGroups:
  - apps.vworkspace.io
  resources:
  - applicationinstances/status
  verbs:
  - get
