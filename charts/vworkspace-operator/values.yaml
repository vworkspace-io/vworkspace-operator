# Default values for vworkspace-operator.
# See docs/install/helm.md and docs/install/quickstart.md for install examples.
# Session 3 dogfood profile: values-kind.yaml (Flux + Velero + MinIO + metrics).

nameOverride: ""
fullnameOverride: ""

image:
  repository: vworkspace/vworkspace-operator
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

crds:
  # Install CRDs as part of the Helm release (cluster-scoped).
  install: true

agent:
  enabled: false
  # HTTPS base URL of vWorkspace Server (the control plane).
  controlPlaneBaseUrl: "https://control-plane.example.org"
  pollIntervalSeconds: 30
  credentialsSecret: vworkspace-agent-credentials

webhooks:
  enabled: false
  certPath: /tmp/k8s-webhook-server/serving-certs

manager:
  leaderElect: true
  healthProbeBindAddress: ":8081"
  # Set to ":8443" to expose HTTPS /metrics (Phase 8 observability on kind).
  metricsBindAddress: "0"

# --- Bundle v1 (optional; default off for contract-tier validate-helm-kind) ---

flux:
  enabled: false
  # When true with enabled, chart installs helm-controller + source-controller.
  # Set installed=false if flux-system already exists on the cluster.
  installed: true
  namespace: flux-system
  version: v2.4.0

velero:
  enabled: false
  installed: true
  namespace: velero
  image:
    repository: velero/velero
    tag: v1.15.0
  awsPlugin:
    repository: velero/velero-plugin-for-aws
    tag: v1.10.0
  bucket: velero
  backupLocation:
    region: minio
    s3Url: ""  # defaults to http://minio.<velero.namespace>.svc:9000 when minio enabled
    s3ForcePathStyle: "true"
  minio:
    enabled: false
    accessKey: minio
    secretKey: minio123
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    mcImage: minio/mc:RELEASE.2024-05-24T09-08-49Z

# Placeholders — out of scope for bundle v1 (Session 3 design).
certManager:
  enabled: false
externalSecrets:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
