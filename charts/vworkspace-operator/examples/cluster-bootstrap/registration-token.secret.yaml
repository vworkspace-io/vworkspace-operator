# One-time registration token from vWorkspace Server (Cluster Registry or bootstrap script).
# Replace the placeholder before applying. Token shape: vwksp-reg-<hex>
apiVersion: v1
kind: Secret
metadata:
  name: cluster-local-registration
  namespace: vworkspace-system
type: Opaque
stringData:
  registrationToken: vwksp-reg-REPLACE_ME
