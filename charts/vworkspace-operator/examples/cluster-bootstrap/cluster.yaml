# Declarative cluster registration (cluster-bootstrap v2 golden path).
# Apply after helm install and the registration-token Secret above.
apiVersion: ops.vworkspace.io/v1alpha1
kind: Cluster
metadata:
  name: cluster-local
spec:
  # HTTPS base URL reachable from operator pods (kind on Linux: host gateway, not 127.0.0.1).
  controlPlaneEndpoint: https://workspace.example.org
  # Optional when the token is bound to a known cluster; server returns clusterId on first registration.
  # clusterId: <server-issued-uuid>
  registrationTokenSecretRef:
    name: cluster-local-registration
    key: registrationToken
