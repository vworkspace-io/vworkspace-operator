# Session 3 dogfood profile for kind + host-run vWorkspace Server.
# Hub design: vworkspace/docs/dogfooding/session-3-helm-path-design.md
#
# Install (single pass — no agent toggle):
#   helm upgrade --install vworkspace-operator ./charts/vworkspace-operator \
#     -n vworkspace-system --create-namespace \
#     -f charts/vworkspace-operator/values-kind.yaml
#
# Register via Cluster CR + token Secret (see cluster-bootstrap-v2 design).
# Break-glass: kubectl exec ... /manager register ...

image:
  repository: docker.io/vworkspace/vworkspace-operator
  tag: latest
  pullPolicy: IfNotPresent

crds:
  install: true

agent:
  credentialsSecret: vworkspace-agent-credentials
  pollIntervalSeconds: 5

manager:
  leaderElect: true
  healthProbeBindAddress: ":8081"
  metricsBindAddress: ":8443"

flux:
  enabled: true
  installed: true
  namespace: flux-system
  version: v2.4.0

velero:
  enabled: true
  installed: true
  crdsInstall: true
  namespace: velero
  minio:
    enabled: true

certManager:
  enabled: false
externalSecrets:
  enabled: false
webhooks:
  enabled: false
