apiVersion: v2
name: vworkspace-operator
description: Kubernetes operator for vWorkspace ApplicationInstance and Operation CRDs
type: application
version: 0.0.11
appVersion: "0.0.11"
kubeVersion: ">=1.28.0-0"
home: https://github.com/vworkspace-io/vworkspace-operator
sources:
  - https://github.com/vworkspace-io/vworkspace-operator
dependencies:
  - name: velero-crds
    version: "0.0.0"
    condition: velero.crdsInstall
  - name: seaweedfs-crds
    version: "0.0.0"
    condition: seaweedfsOperator.crdsInstall
