{{- if .Values.webhooks.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vworkspace-operator.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    {{- include "vworkspace-operator.selectorLabels" . | nindent 4 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "vworkspace-operator.fullname" . }}-validating-webhook
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "vworkspace-operator.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-ops-vworkspace-io-v1alpha1-operation
    failurePolicy: Fail
    name: voperation.kb.io
    rules:
      - apiGroups:
          - ops.vworkspace.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - operations
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "vworkspace-operator.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-apps-vworkspace-io-v1alpha1-applicationinstance
    failurePolicy: Fail
    name: vapplicationinstance.kb.io
    rules:
      - apiGroups:
          - apps.vworkspace.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - applicationinstances
    sideEffects: None
{{- end }}
