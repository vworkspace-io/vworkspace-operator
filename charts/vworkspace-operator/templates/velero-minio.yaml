{{- if and .Values.velero.enabled .Values.velero.installed .Values.velero.minio.enabled }}
{{- $ns := .Values.velero.namespace }}
{{- $accessKey := .Values.velero.minio.accessKey }}
{{- $secretKey := .Values.velero.minio.secretKey }}
{{- $bucket := .Values.velero.bucket }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: velero-minio
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id={{ $accessKey }}
    aws_secret_access_key={{ $secretKey }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ $ns }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
        app.kubernetes.io/component: minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.velero.minio.image }}
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: {{ $accessKey | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ $secretKey | quote }}
          ports:
            - containerPort: 9000
              name: api
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ $ns }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vworkspace-operator.fullname" . }}-minio-setup
  namespace: {{ $ns }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-setup
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.velero.minio.mcImage }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              mc alias set local http://minio.{{ $ns }}.svc:9000 {{ $accessKey }} {{ $secretKey }} &&
              mc mb -p local/{{ $bucket }} || true
{{- end }}
