{{- if and .Values.velero.enabled .Values.velero.installed }}
{{- $ns := .Values.velero.namespace }}
{{- $bucket := .Values.velero.bucket }}
{{- $s3Url := .Values.velero.backupLocation.s3Url }}
{{- if not $s3Url }}
{{- $s3Url = printf "http://minio.%s.svc:9000" $ns }}
{{- end }}
{{- if not .Values.velero.minio.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
{{- end }}
{{- if not .Values.velero.minio.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: velero
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id={{ .Values.velero.minio.accessKey }}
    aws_secret_access_key={{ .Values.velero.minio.secretKey }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero
  namespace: {{ $ns }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: velero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vworkspace-operator.fullname" . }}-velero
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: velero
    namespace: {{ $ns }}
---
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: {{ $ns }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: velero
spec:
  provider: aws
  default: true
  objectStorage:
    bucket: {{ $bucket }}
  config:
    region: {{ .Values.velero.backupLocation.region | quote }}
    s3ForcePathStyle: {{ .Values.velero.backupLocation.s3ForcePathStyle | quote }}
    s3Url: {{ $s3Url | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero
  namespace: {{ $ns }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: velero
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: velero
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: velero
        app.kubernetes.io/instance: {{ .Release.Name }}
        deploy: velero
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: velero
      initContainers:
        - name: velero-plugin-for-aws
          image: {{ printf "%s:%s" .Values.velero.awsPlugin.repository .Values.velero.awsPlugin.tag }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: plugins
              mountPath: /target
      containers:
        - name: velero
          image: {{ printf "%s:%s" .Values.velero.image.repository .Values.velero.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - /velero
          args:
            - server
            - --uploader-type=kopia
          env:
            - name: VELERO_SCRATCH_DIR
              value: /scratch
            - name: VELERO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LD_LIBRARY_PATH
              value: /plugins
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /credentials/cloud
          ports:
            - name: metrics
              containerPort: 8085
          volumeMounts:
            - name: plugins
              mountPath: /plugins
            - name: scratch
              mountPath: /scratch
            - name: cloud-credentials
              mountPath: /credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: plugins
          emptyDir: {}
        - name: scratch
          emptyDir: {}
        - name: cloud-credentials
          secret:
            secretName: cloud-credentials
{{- end }}
