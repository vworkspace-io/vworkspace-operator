{{- if and .Values.seaweedfsOperator.enabled .Values.seaweedfsOperator.installed }}
{{- $ns := .Values.seaweedfsOperator.namespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: seaweedfs-operator
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: seaweedfs-operator
  namespace: {{ $ns }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs-operator
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
spec:
  interval: 1h
  url: {{ .Values.seaweedfsOperator.helmRepo | quote }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: {{ $ns }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs-operator
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
spec:
  interval: 1h
  install:
    createNamespace: false
  chart:
    spec:
      chart: seaweedfs-operator
      version: {{ .Values.seaweedfsOperator.chartVersion | quote }}
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
        namespace: {{ $ns }}
  values:
    crds:
      create: false
    webhook:
      enabled: {{ .Values.seaweedfsOperator.webhook.enabled }}
{{- end }}
