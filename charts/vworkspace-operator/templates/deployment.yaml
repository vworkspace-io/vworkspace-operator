apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vworkspace-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vworkspace-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vworkspace-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vworkspace-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vworkspace-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "vworkspace-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect={{ .Values.manager.leaderElect }}
            - --health-probe-bind-address={{ .Values.manager.healthProbeBindAddress }}
            - --metrics-bind-address={{ .Values.manager.metricsBindAddress }}
            - --agent-enabled={{ .Values.agent.enabled }}
            - --agent-poll-interval={{ .Values.agent.pollIntervalSeconds }}s
            {{- if .Values.agent.enabled }}
            {{- $controlPlaneURL := .Values.agent.controlPlaneBaseUrl }}
            {{- if not $controlPlaneURL }}
            {{- $controlPlaneURL = .Values.agent.odooBaseUrl }}
            {{- end }}
            - --control-plane-base-url={{ $controlPlaneURL | quote }}
            - --agent-credentials-secret={{ .Values.agent.credentialsSecret }}
            {{- end }}
            {{- if .Values.webhooks.enabled }}
            - --webhooks-enabled=true
            - --webhook-cert-path={{ .Values.webhooks.certPath }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.webhooks.enabled }}
            - name: webhook-server
              containerPort: 9443
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
