name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.repository }}-self-hosted
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    name: Verify generated artifacts
    runs-on: self-hosted
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Verify generated manifests
        run: |
          chmod +x hack/verify-generated.sh
          ./hack/verify-generated.sh

  test:
    permissions:
      contents: read
    name: Unit and envtest
    runs-on: self-hosted
    needs: verify
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go mod tidy
          make test

  lint:
    permissions:
      contents: read
    name: golangci-lint
    runs-on: self-hosted
    needs: test
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config

      - name: Lint
        run: make lint
